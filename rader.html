<!DOCTYPE HTML>
<html lang="ja">

<head prefix="og: http://ogp.me/ns# fb: http://ogp.me/ns/fb# article: http://ogp.me/ns/article#">
	<meta charset='UTF-8' name='viewport'
		content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no'>
	<title>雨雲レーダー</title>

	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
	<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/leaflet-hash@0.2.1/leaflet-hash.min.js"></script>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-easybutton@2/src/easy-button.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet-easybutton@2/src/easy-button.js"></script>

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
		integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"
		integrity="sha512-GWzVrcGlo0TxTRvz9ttioyYJ+Wwk9Ck0G81D+eO63BaqHaJ3YZX9wuqjwgfcV/MrB2PhaVX9DkYVhbFpStnqpQ=="
		crossorigin="anonymous" referrerpolicy="no-referrer"></script>

	<script type='module'>
		onload = async () => {

			const res = await fetch('https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json');
			const data = await res.json();

			let day_time = data[0].basetime;
			let valid_time = data[0].validtime;
			let year = day_time.slice(0, 4);
			let month = day_time.slice(4, 6);
			let day = day_time.slice(6, 8);
			let jikoku_h = parseInt(day_time.slice(8, 10), 10) + 9;
			if (jikoku_h > 23) {
				jikoku_h = jikoku_h - 24;
			} else { }

			let jikoku_m = day_time.slice(10, 12);

			time_stamp.innerHTML = year + "年" + month + "月" + day + "日" + jikoku_h + "時" + jikoku_m + "分";

			let tiri = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png', {
				attribution: "&copy; <a href=\"https://carto.com/about-carto/\" target=\"_blank\" rel=\"noopener\">CARTO</a>, &copy; <a href=\"http://www.openstreetmap.org/about/\" target=\"_blank\">OpenStreetMap</a> contributors"
			});

			let ame_layer = new L.tileLayer(`https://www.jma.go.jp/bosai/jmatile/data/nowc/${day_time}/none/${valid_time}/surf/hrpns/{z}/{x}/{y}.png`, {
				opacity: 0.8,
				attribution: "<br><a href='https://www.jma.go.jp/jma/kishou/know/kurashi/highres_nowcast.html'>気象庁(高解像度降水ナウキャスト)</a>"
			});

			const map = L.map('map', {
				center: [36.474, 137.777],
				maxZoom: 14,
				minZoom: 6,
				zoomControl: false,
				zoom: 6,
				layers: [tiri, ame_layer]
			});

			L.control.zoom({
				position: 'topright'
			}).addTo(map);

			L.hash(map);

			let reload = () =>{
				location.href = "./rader.html";
			}

			let reload_button = L.easyButton('fa-arrow-rotate-left', function () { reload(); }, { position: 'topright' }).addTo(map);

		}
	</script>

	<style>
		html,
		body,
		#map {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			z-index: 0;
		}

		#time_stamp {
			z-index: 100;
			position: fixed;
			left: 5px;
			top: 5px;
			background: rgba(255, 255, 255, 0.8);
			padding: 5px;
			border: 3px solid #a0d8ef;
		}
	</style>

</head>

<body>

	<div id="time_stamp"></div>
	<div id='map'></div>


</body>

</html>
